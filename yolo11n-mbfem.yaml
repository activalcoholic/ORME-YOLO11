# ORME-YOLO11n with MBFEM on P3, P4 and P5.
# [from, repeats, module, args]

nc: 1
scale: n

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]            # 0 - P1/2
  - [-1, 1, Conv, [128, 3, 2]]           # 1 - P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]    # 2
  - [-1, 1, Conv, [256, 3, 2]]           # 3 - P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]    # 4
  - [-1, 1, Conv, [512, 3, 2]]           # 5 - P4/16
  - [-1, 2, C3k2, [512, True]]           # 6
  - [-1, 1, Conv, [1024, 3, 2]]          # 7 - P5/32
  - [-1, 2, C3k2, [1024, True]]          # 8
  - [-1, 1, SPPF, [1024, 5]]            # 9
  - [-1, 2, C2PSA, [1024]]              # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 6], 1, Concat, [1]]                  # 12
  - [-1, 2, C3k2, [512, False]]                # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14
  - [[-1, 4], 1, Concat, [1]]                  # 15
  - [-1, 2, C3k2, [256, False]]                # 16 - P3/8

  - [-1, 1, Conv, [256, 3, 2]]                 # 17
  - [[-1, 13], 1, Concat, [1]]                 # 18
  - [-1, 2, C3k2, [512, False]]                # 19 - P4/16

  - [-1, 1, Conv, [512, 3, 2]]                 # 20
  - [[-1, 10], 1, Concat, [1]]                 # 21
  - [-1, 2, C3k2, [1024, True]]                # 22 - P5/32

  - [16, 1, MBFEM, [256, 1, 3, [1, 2, 3], 16, 7, 7, 0.02]]   # 23 - MBFEM-P3
  - [19, 1, MBFEM, [512, 1, 3, [1, 2, 3], 16, 7, 7, 0.02]]   # 24 - MBFEM-P4
  - [22, 1, MBFEM, [1024, 1, 3, [1, 2, 3], 16, 7, 7, 0.02]]  # 25 - MBFEM-P5

  - [[23, 24, 25], 1, Detect, [nc]]            # 26 - Detect(P3, P4, P5)
